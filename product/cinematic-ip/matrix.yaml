  - calibrate-cinematic-ip

test_cases:
  - name: detective-chinatown
    validates:
      - multi_level_story_lines
      - unit_story_and_meta_arc
      - character_moral_question
  - name: crazy-little-yang
    validates:
      - lifecycle_and_episode_desire_chain
      - counter_desire_engine
      - silent_behavior_test
      - sitcom_reset_engine
      - family_relationship_engine
      - comedy_emotional_release
  - name: dayuange
    validates:
      - emotional_anthology
      - recurring_emotional_theme
      - restrained_exit_emotion
  - name: let-the-bullets-fly
    validates:
      - three_way_power_conflict
      - dense_dialogue_action
      - tonal_hybrid
      - performance_fit
  - name: stephen-chow-comedy
    validates:
      - nobody_growth_arc
      - comic_duo_rhythm
      - comedy_and_pathos
  - name: zhang-yimou-visual-system
    validates:
      - color_as_structure
      - production_design_integration
      - visual_duality
  - name: four-episode-calibration-loop
    validates:
      - immutable_preflight
      - append_only_publish_and_metrics
      - prediction_to_outcome_join
      - three_retrospective_promotion_gate
      - heldout_portability_test
